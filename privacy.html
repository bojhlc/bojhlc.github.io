    <h1>隐私政策</h1>
    <p>本应用（你的应用名称）非常重视用户的隐私。</p>
    <h2>信息收集</h2>
    <p>本应用仅在你授权的情况下访问你的 Google Drive 文件，用于同步目的，不会收集或存储任何其他个人信息。</p>
    <h2>信息使用</h2>
    <p>所获取的文件数据仅用于在你的 NAS 和 Google Drive 之间进行同步，不会用于任何其他用途。</p>
